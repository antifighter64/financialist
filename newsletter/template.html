<!doctype html><html><head><meta charset="utf-8"><title>Financialist daily brief</title></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Georgia,serif;color:#1a2330">
<div style="max-width:600px;margin:0 auto;background:#ffffff">
<div style="padding:24px 28px;border-bottom:3px solid #0f7b5f"><span style="font-size:24px;font-weight:700">Financial<span style="color:#0f7b5f">ist</span></span><span style="float:right;font-size:12px;color:#667">{{DATE}}</span></div>
<div style="padding:20px 28px">

<!-- STORY SLOT x3: repeat block per story -->

<h3 style="font-size:15px;margin:0 0 8px">New on Financialist</h3>
<p style="font-size:14px;margin:0"><a href="{{GUIDE_URL}}" style="color:#0f7b5f">{{GUIDE_TITLE}}</a></p>
</div>
</div>
<div style="padding:18px 28px;background:#f4f6f8;font-size:11px;color:#889">Financialist, {{DATE}}. You are getting this because you subscribed at financialist.com. <a href="{{UNSUB_URL}}">Unsubscribe</a>. Financialist may earn a commission from partner links.</div>
</div></body></html>
